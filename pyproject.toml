[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "conspiracy_benchmark"
version = "0.0.1"
description = "Analisi e valutazione di i modelli di intelligenza artificiale per il riconoscimento di teorie del complotto"
authors = [
  { name = "Sara Mirra" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["conspiracy_benchmark"]
include = ["pyproject.toml", "conspiracy_benchmark/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["conspiracy_benchmark"]
force-sort-within-sections = true

